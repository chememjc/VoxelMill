# Tests on every push and pull request. release.yml builds the portables;
# this workflow is the safety net that runs the suite.
#
# Two Linux legs cover both native parallel paths: 3.10 builds without oneTBB
# (the std::thread fallback in native/parallel.hpp, which is what the release
# portables ship) and 3.12 builds with it.

name: ci

"on":
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (py${{ matrix.python }}${{ matrix.tbb && ', tbb' || '' }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            tbb: false
          - python: '3.12'
            tbb: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: System packages (headless Qt/VTK)
        run: |
          sudo apt-get update
          # Qt 6.5+ needs the xcb cursor and utility libraries for the tests
          # that render through a real X display in a child process.
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libgl1 libgl1-mesa-dri \
            libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 ninja-build \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
          if [ "${{ matrix.tbb }}" = "true" ]; then sudo apt-get install -y libtbb-dev; fi

      # scripts/equivalence.py drives `<root>/.venv/bin/python`, so the suite
      # uses a venv inside the checkout, the same layout as a developer tree.
      - name: Build and install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install cmake pybind11==3.0.4 scikit-build-core==0.11.6
          .venv/bin/python -m pip install --no-build-isolation '.[gui,test]'
          .venv/bin/python -c "import voxelmill._native as n; print('HAS_TBB', n.HAS_TBB)"

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run -a .venv/bin/python -m pytest -q -m "not samples" -p no:cacheprovider

  lint:
    name: lint and types
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Tools
        run: python -m pip install 'ruff>=0.16,<0.17' 'mypy>=1.15,<2' 'numpy>=1.26,<3'
      - name: ruff
        run: ruff check src tests scripts
      - name: mypy
        run: mypy src/voxelmill

  golden:
    # Report equality is exact. Build-dependent rounding in support sampling
    # was removed (NumPy 1.26 and 2.2 now agree 18/18), but a runner CPU with
    # other SIMD paths (AVX-512 SVML transcendentals) can still move a result
    # by an ulp at a threshold, so this job stays advisory (see gotchas.md).
    name: golden reports
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Build and install
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install cmake pybind11==3.0.4 scikit-build-core==0.11.6
          .venv/bin/python -m pip install --no-build-isolation .
      - name: Compare against reports/golden
        run: .venv/bin/python scripts/equivalence.py --jobs 4
