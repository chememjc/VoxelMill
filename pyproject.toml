[build-system]
requires = ["scikit-build-core==0.11.6", "pybind11==3.0.4"]
build-backend = "scikit_build_core.build"

[project]
name = "voxelmill"
version = "0.2.0"
description = "Single-part Linux resin preparation with explicit validation evidence"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.10,<2", "manifold3d==3.3.2", "tomli==2.2.1; python_version < '3.11'", "threadpoolctl>=3.1,<4", "websocket-client>=1.7,<2"]

[project.optional-dependencies]
gui = ["PySide6>=6.6,<7", "vtk>=9.3,<10"]
test = ["pytest>=7,<9", "psutil>=5,<8"]

[project.scripts]
voxelmill = "voxelmill.cli:main"

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["src/voxelmill"]
build-dir = "build/{wheel_tag}"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["samples: full-resolution original fixture suite (opt in)",
           "gui: end-to-end editor tests; slower, need an offscreen Qt platform"]
